<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#c0392b" />
    <title>Aplikasi Kanji MrDJ</title>
    <style>
      /* ===== Tema ===== */
      :root {
        --bg: #faf8f5;
        --card: #fff;
        --tx: #1f1d1a;
        --mut: #7a746b;
        --bd: #e6e0d6;
        --ac: #c0392b;
        --chip: #f3ece1;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #171614;
          --card: #222120;
          --tx: #f0ece6;
          --mut: #a39c91;
          --bd: #37352f;
          --ac: #ef6c5d;
          --chip: #2e2c28;
          color-scheme: dark;
        }
      }
      :root[data-theme='dark'] {
        --bg: #171614;
        --card: #222120;
        --tx: #f0ece6;
        --mut: #a39c91;
        --bd: #37352f;
        --ac: #ef6c5d;
        --chip: #2e2c28;
        color-scheme: dark;
      }

      /* ===== Dasar ===== */
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html {
        scroll-padding-top: 150px;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          'Noto Sans JP',
          'Noto Sans',
          sans-serif;
        line-height: 1.5;
        touch-action: manipulation;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--ac);
        outline-offset: 2px;
      }
      h1 {
        font-size: 18px;
        margin: 0;
      }
      h2 {
        font-size: 19px;
        margin: 6px 0 12px;
      }
      h3 {
        font-size: 16px;
        margin: 22px 0 8px;
      }
      .wrap {
        max-width: 760px;
        margin: 0 auto;
        padding: 16px max(12px, env(safe-area-inset-right, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
      }
      .note,
      .empty {
        color: var(--mut);
        font-size: 14px;
        margin: 0 0 12px;
      }
      .foot {
        color: var(--mut);
        font-size: 11px;
        margin-top: 28px;
        text-align: center;
      }

      /* ===== Header ===== */
      .hd {
        position: sticky;
        top: 0;
        z-index: 20;
        background: var(--bg);
        border-bottom: 1px solid var(--bd);
        padding: calc(env(safe-area-inset-top, 0px) + 10px) max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px));
      }
      .hd-in {
        max-width: 760px;
        margin: 0 auto;
      }
      .top {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .cnt {
        color: var(--mut);
        font-size: 12px;
      }
      #q {
        width: 100%;
        height: 44px;
        padding: 0 14px;
        border: 1px solid var(--bd);
        border-radius: 12px;
        background: var(--card);
        color: var(--tx);
        font-size: 16px;
        -webkit-appearance: none;
        appearance: none;
      }
      .chips {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 8px 0 2px;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      .chips::-webkit-scrollbar {
        display: none;
      }
      .chip {
        flex: none;
        min-height: 40px;
        padding: 0 16px;
        border-radius: 99px;
        border: 1px solid var(--bd);
        background: var(--card);
      }
      .chip.on {
        background: var(--ac);
        border-color: var(--ac);
        color: #fff;
      }
      .chip.sm {
        min-height: 34px;
        padding: 0 14px;
        font-size: 14px;
      }

      /* ===== Daftar & ubin ===== */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
        gap: 8px;
      }
      .tile {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 12px;
        padding: 8px 2px;
        text-align: center;
        min-height: 76px;
        overflow: hidden;
      }
      .tile:hover,
      .tile:active {
        border-color: var(--ac);
      }
      .tile b {
        display: block;
        font-size: 32px;
        font-weight: 500;
        line-height: 1.2;
      }
      .tile span {
        display: block;
        font-size: 11px;
        color: var(--mut);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        padding: 0 4px;
      }
      .more {
        display: block;
        width: 100%;
        margin-top: 14px;
        min-height: 46px;
        border-radius: 12px;
        border: 1px solid var(--bd);
        background: var(--card);
      }
      .lnk,
      .back,
      .nav button {
        background: none;
        border: 0;
        color: var(--ac);
      }
      .lnk {
        text-decoration: underline;
        padding: 0;
      }
      .back {
        padding: 8px 0;
        min-height: 44px;
      }
      .nav {
        display: flex;
        justify-content: space-between;
        margin-bottom: 6px;
      }
      .nav button {
        padding: 10px 0;
        min-height: 44px;
      }
      .rel {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .rel .tile {
        width: 64px;
        min-height: 64px;
      }
      .rel .tile b {
        font-size: 28px;
      }

      /* ===== Detail kanji ===== */
      .hero {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 16px;
        padding: 18px 16px;
        text-align: center;
      }
      .big {
        font-size: clamp(80px, 30vw, 110px);
        line-height: 1.1;
        margin: 0;
      }
      .strokes {
        color: var(--mut);
        font-size: 13px;
      }
      .row {
        text-align: left;
        margin: 8px 0;
        font-size: 15px;
      }
      .row em {
        font-style: normal;
        color: var(--mut);
        font-size: 13px;
        margin-right: 8px;
      }
      .tags {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: center;
        margin-top: 12px;
      }
      .tag {
        background: var(--chip);
        border-radius: 99px;
        padding: 3px 10px;
        font-size: 12px;
      }

      /* ===== Urutan goresan ===== */
      .sw {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 16px;
        width: 220px;
        max-width: 100%;
        margin: 0 auto 10px;
      }
      .sw svg,
      .steps svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .an {
        stroke-dasharray: 1 2;
      }
      .pl {
        display: block;
        margin: 0 auto;
        background: var(--ac);
        color: #fff;
        border: 0;
        border-radius: 99px;
        padding: 0 22px;
        min-height: 44px;
      }
      .sc {
        text-align: center;
        color: var(--mut);
        font-size: 13px;
        margin: 8px 0 0;
      }
      .steps {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
        gap: 6px;
        margin-top: 16px;
      }
      .steps svg {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 10px;
      }

      /* ===== Kosakata ===== */
      .seg {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }
      .word {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 12px;
        padding: 10px 14px;
        margin-bottom: 8px;
      }
      .word .jp {
        font-size: 20px;
      }
      .word .jp button {
        font-size: inherit;
        background: none;
        border: 0;
        padding: 0;
        color: var(--ac);
      }
      .word .cur {
        font-weight: 700;
      }
      .word .rd {
        color: var(--mut);
        font-size: 14px;
        margin-left: 6px;
      }
      .word .tag {
        margin-left: 8px;
        font-size: 11px;
        padding: 1px 8px;
        vertical-align: 2px;
      }
      .word p {
        margin: 2px 0 0;
        font-size: 14px;
        color: var(--mut);
      }
    </style>
  </head>
  <body>
    <header class="hd">
      <div class="hd-in">
        <div class="top">
          <h1>漢字 Kanji by MrDJ</h1>
          <span class="cnt" id="cnt"></span>
        </div>
        <input id="q" type="search" placeholder="Search kanji, meanings, or readings…" autocomplete="off" autocapitalize="off" />
        <div class="chips" id="chips"></div>
      </div>
    </header>
    <main class="wrap" id="main"></main>

    <script>
      'use strict';

      /* =====================================================
         1. KONFIGURASI
         ===================================================== */
      const KANJIAPI_URL = 'https://kanjiapi.dev/v1';
      const JLPT_URL = 'https://raw.githubusercontent.com/davidluzgouveia/kanji-data/master/kanji.json';
      const KANJIVG_URL = 'https://raw.githubusercontent.com/KanjiVG/kanjivg/master/kanji/';

      const LIST_PAGE = 120; // jumlah kanji per halaman daftar
      const WORDS_PAGE = 15; // jumlah kosakata per halaman
      const RELATED_MAX = 12; // jumlah kanji terkait

      const CATS = [
        ['hiragana', 'Hiragana'],
        ['katakana', 'Katakana'],
        ['n5', 'N5'],
        ['n4', 'N4'],
        ['n3', 'N3'],
        ['n2', 'N2'],
        ['n1', 'N1'],
      ];

      const GRADE_LABEL = {
        1: 'Kelas 1 SD',
        2: 'Kelas 2 SD',
        3: 'Kelas 3 SD',
        4: 'Kelas 4 SD',
        5: 'Kelas 5 SD',
        6: 'Kelas 6 SD',
        8: 'Jōyō (SMP–SMA)',
        9: 'Jinmeiyō (nama)',
        10: 'Jinmeiyō (nama)',
      };

      // Cadangan jika KanjiVG tidak bisa dimuat (offline)
      const FALLBACK_STROKES = {
        一: ['M12,54 L97,54'],
        二: ['M22,34 L87,34', 'M12,80 L97,80'],
        三: ['M25,24 L84,24', 'M30,54 L80,54', 'M12,86 L97,86'],
        十: ['M14,54 L95,54', 'M54,12 L54,98'],
        人: ['M52,18 C48,50 32,78 12,95', 'M48,48 C60,70 78,88 98,95'],
        大: ['M14,40 L95,40', 'M54,14 C52,50 35,82 12,98', 'M52,48 C62,70 80,88 98,98'],
        小: ['M54,14 L54,92 C54,98 48,98 40,94', 'M34,40 C30,60 22,76 10,90', 'M76,38 C80,58 88,74 100,88'],
        山: ['M54,16 L54,80', 'M20,46 L20,90 L92,90', 'M88,46 L88,90'],
        日: ['M28,16 L28,96', 'M28,16 L82,16 L82,96', 'M28,56 L82,56', 'M28,96 L82,96'],
        月: ['M34,14 C34,60 28,84 14,98', 'M34,14 L84,14 L84,92 C84,98 78,98 70,94', 'M34,40 L84,40', 'M34,66 L84,66'],
        木: ['M12,44 L97,44', 'M54,12 L54,98', 'M52,48 C44,70 28,86 10,96', 'M56,48 C64,70 80,86 98,96'],
        口: ['M26,28 L26,88', 'M26,28 L84,28 L84,88', 'M26,88 L84,88'],
        中: ['M24,34 L24,76', 'M24,34 L84,34 L84,76', 'M24,76 L84,76', 'M54,10 L54,100'],
        上: ['M54,14 L54,84', 'M54,50 L80,50', 'M14,92 L96,92'],
        下: ['M12,22 L96,22', 'M54,22 L54,98', 'M62,52 L84,70'],
        土: ['M26,48 L82,48', 'M54,14 L54,92', 'M14,92 L96,92'],
        川: ['M30,18 C30,56 24,80 12,96', 'M54,14 L54,98', 'M82,14 L82,98'],
        八: ['M40,24 C38,54 26,76 12,90', 'M68,34 C74,60 86,80 98,92'],
        七: ['M14,46 L96,46', 'M46,14 L46,74 C46,92 62,96 94,90'],
      };

      /* =====================================================
         2. STATE
         ===================================================== */
      const state = {
        cat: 'n5',
        query: '',
        limit: LIST_PAGE,
        current: null, // kanji yang sedang dibuka (null = tampilan daftar)
        list: [], // daftar yang sedang tampil, dipakai untuk tombol Sebelumnya/Selanjutnya
        jlpt: null, // data kanji-data (GitHub)
        jlptStatus: 'idle', // idle | loading | ok | err
        keys: null, // cache semua kunci untuk pencarian
        words: null, // { kanji, list } kosakata kanji yang sedang dibuka
        wordMode: 'common', // common | all
        wordLimit: WORDS_PAGE,
      };
      let timers = [];

      const $ = (id) => document.getElementById(id);
      const main = $('main');
      const searchInput = $('q');
      const counter = $('cnt');

      /* =====================================================
         3. UTILITAS
         ===================================================== */
      const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' };
      const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ESC[c]);

      const isKanji = (c) => /[\u3400-\u9fff\u{20000}-\u{2ffff}]/u.test(c);
      const toKatakana = (s) => s.replace(/[\u3041-\u3096]/g, (c) => String.fromCharCode(c.charCodeAt(0) + 96));
      const clearTimers = () => {
        timers.forEach(clearTimeout);
        timers = [];
      };

      const fetchCache = new Map();
      function fetchJSON(url) {
        if (!fetchCache.has(url)) {
          const req = fetch(url)
            .then((r) => {
              if (!r.ok) throw new Error('HTTP ' + r.status);
              return r.json();
            })
            .catch((err) => {
              fetchCache.delete(url); // jangan simpan kegagalan, agar bisa dicoba lagi
              throw err;
            });
          fetchCache.set(url, req);
        }
        return fetchCache.get(url);
      }

      /* =====================================================
         4. DATA KANA & INFO KANJI
         ===================================================== */
      const HIRAGANA = 'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん';
      const ROMAJI = 'a i u e o ka ki ku ke ko sa shi su se so ta chi tsu te to na ni nu ne no ha hi fu he ho ma mi mu me mo ya yu yo ra ri ru re ro wa wo n'.split(' ');
      const KANA = {};
      HIRAGANA.split('').forEach((c, i) => {
        KANA[c] = ROMAJI[i];
        KANA[toKatakana(c)] = ROMAJI[i];
      });

      // Info dasar (tanpa API): dari tabel kana atau dataset kanji-data
      function baseInfo(k) {
        if (KANA[k]) {
          const hira = /[\u3041-\u3096]/.test(k);
          return {
            kana: true,
            meanings: [KANA[k]],
            label: hira ? 'Hiragana' : 'Katakana',
            related: hira ? toKatakana(k) : String.fromCharCode(k.charCodeAt(0) - 96),
          };
        }
        const r = state.jlpt && state.jlpt[k];
        if (!r) return { meanings: [], kun: '', on: '', jlpt: '' };
        return {
          strokes: r.strokes,
          meanings: r.meanings || [],
          kun: (r.readings_kun || []).join('、'),
          on: toKatakana((r.readings_on || []).join('、')),
          jlpt: r.jlpt_new ? 'JLPT N' + r.jlpt_new : '',
        };
      }

      function matches(k, term) {
        const b = baseInfo(k);
        return `${k} ${b.meanings.join(' ')} ${b.kun || ''} ${b.on || ''}`.toLowerCase().includes(term);
      }

      function allKeys() {
        if (!state.keys) state.keys = [...Object.keys(KANA), ...Object.keys(state.jlpt || {})];
        return state.keys;
      }

      function listFor(cat) {
        if (cat === 'hiragana') return HIRAGANA.split('');
        if (cat === 'katakana') return HIRAGANA.split('').map(toKatakana);
        if (!state.jlpt) return [];
        const level = +cat.slice(1);
        return Object.keys(state.jlpt)
          .filter((k) => state.jlpt[k].jlpt_new === level)
          .sort((a, b) => (state.jlpt[a].freq || 9999) - (state.jlpt[b].freq || 9999));
      }

      const tile = (k) => `<button class="tile" data-k="${k}"><b>${k}</b><span>${esc(baseInfo(k).meanings[0] || '')}</span></button>`;

      /* =====================================================
         5. DAFTAR KANJI
         ===================================================== */
      function renderChips() {
        $('chips').innerHTML = CATS.map(([id, label]) => `<button class="chip${id === state.cat && !state.query.trim() ? ' on' : ''}" data-cat="${id}">${label}</button>`).join('');
      }

      function showList() {
        clearTimers();
        state.current = null;
        const term = state.query.trim().toLowerCase();
        const list = term ? allKeys().filter((k) => matches(k, term)) : listFor(state.cat);
        state.list = list;

        let status = '';
        const needsJlpt = !term && /^n\d$/.test(state.cat);
        if (needsJlpt && ['idle', 'loading'].includes(state.jlptStatus)) {
          status = '<p class="note">Loading data kanji from GitHub…</p>';
        } else if (needsJlpt && state.jlptStatus === 'err') {
          status = '<p class="note">Failed to load data from GitHub. Please check your internet connection. <button class="lnk" data-retry="1">Try again</button></p>';
        }

        let body = '';
        if (list.length) {
          body = `<div class="grid">${list.slice(0, state.limit).map(tile).join('')}</div>`;
          if (list.length > state.limit) body += `<button class="more" data-more="1">Show more (${list.length - state.limit})</button>`;
        } else if (!status) {
          body = '<p class="empty">No results found.</p>';
        }

        main.innerHTML = `${status}${body}<p class="foot">Data: KanjiVG (CC BY-SA 3.0), KANJIDIC, JMdict, kanjiapi.dev, dan kanji-data</p>`;
        counter.textContent = list.length + ' characters';
      }

      async function loadJlpt() {
        if (state.jlptStatus === 'loading') return;
        state.jlptStatus = 'loading';
        try {
          state.jlpt = await fetchJSON(JLPT_URL);
          state.keys = null;
          state.jlptStatus = 'ok';
        } catch {
          state.jlptStatus = 'err';
        }
        if (state.current === null) showList();
        else renderHero(state.current); // tampilkan level JLPT yang baru tersedia
      }

      /* =====================================================
         6. DETAIL KANJI
         ===================================================== */
      function showDetail(k) {
        clearTimers();
        state.current = k;
        state.words = null;
        state.wordMode = 'common';
        state.wordLimit = WORDS_PAGE;

        const i = state.list.indexOf(k);
        const n = state.list.length;
        const isKana = Boolean(KANA[k]);

        let html = '<button class="back" data-back="1">← Back</button>';
        if (i > -1 && n > 1) {
          html += `<div class="nav"><button data-nav="${state.list[(i - 1 + n) % n]}">« Previous</button><button data-nav="${state.list[(i + 1) % n]}">Next »</button></div>`;
        }
        html += '<div id="hero"></div><h3>Stroke Order</h3><div id="sv"></div>';
        html += isKana ? '<div id="rel"></div>' : '<h3>Word list</h3><div id="words"></div><div id="rel"></div>';

        main.innerHTML = html;
        window.scrollTo(0, 0);

        renderHero(k);
        renderStrokes(k);
        if (isKana) renderRelated(k, [baseInfo(k).related], 'Padanan');
        else renderWords(k);
      }

      function heroHtml(k, api, status) {
        const b = baseInfo(k);
        let h = `<div class="hero"><p class="big">${k}</p>`;

        if (b.kana) {
          h += `<div class="strokes">${b.label}</div><h2>${esc(b.meanings[0])}</h2></div>`;
          return h;
        }

        const meanings = (api && api.meanings.length ? api.meanings : b.meanings).slice(0, 5).join(', ');
        const kun = api ? api.kun_readings.join('、') : b.kun;
        const on = api ? api.on_readings.join('、') : b.on;
        const strokes = api ? api.stroke_count : b.strokes;
        const tags = [b.jlpt, api && GRADE_LABEL[api.grade]].filter(Boolean);

        h += `<div class="strokes" id="stroke-count">${strokes ? strokes + ' goresan' : ''}</div>`;
        h += `<h2>${esc(meanings || '—')}</h2>`;
        h += `<div class="row"><em>Kun</em>${esc(kun || '—')}</div><div class="row"><em>On</em>${esc(on || '—')}</div>`;
        if (api && api.name_readings.length) h += `<div class="row"><em>Nama</em>${esc(api.name_readings.join('、'))}</div>`;
        if (tags.length) h += `<div class="tags">${tags.map((t) => `<span class="tag">${esc(t)}</span>`).join('')}</div>`;

        const notes = {
          loading: 'Loading detail from kanjiapi.dev…',
          error: 'Failed to load detail from kanjiapi.dev. Please check your internet connection.',
        };
        h += `<p class="note" style="margin:12px 0 0">${notes[status] || 'Meaning from the English dataset (KANJIDIC).'}</p></div>`;
        return h;
      }

      function renderHero(k) {
        const el = $('hero');
        if (!el) return;
        el.innerHTML = heroHtml(k, null, KANA[k] ? '' : 'loading');
        if (KANA[k]) return;
        fetchJSON(`${KANJIAPI_URL}/kanji/${encodeURIComponent(k)}`)
          .then((api) => state.current === k && (el.innerHTML = heroHtml(k, api, '')))
          .catch(() => state.current === k && (el.innerHTML = heroHtml(k, null, 'error')));
      }

      /* =====================================================
         7. URUTAN GORESAN (KanjiVG)
         ===================================================== */
      const strokeCache = new Map();
      async function getStrokes(k) {
        if (strokeCache.has(k)) return strokeCache.get(k);
        try {
          const url = KANJIVG_URL + k.codePointAt(0).toString(16).padStart(5, '0') + '.svg';
          const res = await fetch(url);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const doc = new DOMParser().parseFromString(await res.text(), 'image/svg+xml');
          const paths = [...doc.querySelectorAll('path')].map((n) => n.getAttribute('d')).filter(Boolean);
          if (!paths.length) throw new Error('kosong');
          strokeCache.set(k, paths);
          return paths;
        } catch {
          return FALLBACK_STROKES[k] || null;
        }
      }

      const SVG_ATTRS = 'viewBox="0 0 109 109" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"';
      const GUIDE = '<path d="M54.5,4 V105 M4,54.5 H105" stroke="var(--bd)" stroke-width="0.5" stroke-dasharray="3 4"/>';

      function strokeStart(d) {
        const m = /^M\s*(-?[\d.]+)[,\s]\s*(-?[\d.]+)/i.exec(d);
        return m ? [+m[1], +m[2]] : null;
      }

      // Satu langkah: goresan sebelumnya hitam, goresan saat ini merah dengan nomor
      function stepSvg(paths, i) {
        const done = paths
          .slice(0, i)
          .map((d) => `<path d="${d}" stroke="var(--tx)"/>`)
          .join('');
        const start = strokeStart(paths[i]);
        const num = start ? `<text x="${Math.max(2, Math.min(100, start[0] - 4))}" y="${Math.max(11, start[1] - 3)}" font-size="11" font-weight="700" font-family="sans-serif" fill="var(--ac)" stroke="none">${i + 1}</text>` : '';
        return `<svg ${SVG_ATTRS} role="img" aria-label="Stroke ${i + 1}">${GUIDE}${done}<path d="${paths[i]}" stroke="var(--ac)"/>${num}</svg>`;
      }

      async function renderStrokes(k) {
        const box = $('sv');
        box.innerHTML = '<p class="sc">Loading strokes order…</p>';
        const paths = await getStrokes(k);
        if (state.current !== k) return;
        if (!paths) {
          box.innerHTML = '<p class="sc">Cannot load stroke order from KanjiVG. Please check your internet connection.</p>';
          return;
        }

        const ghost = paths.map((d) => `<path d="${d}" stroke="var(--bd)"/>`).join('');
        const animated = paths.map((d) => `<path class="an" d="${d}" pathLength="1" stroke="var(--tx)"/>`).join('');
        const steps = paths.map((_, i) => stepSvg(paths, i)).join('');

        box.innerHTML = `<div class="sw"><svg ${SVG_ATTRS}>${GUIDE}${ghost}${animated}</svg></div>` + `<button class="pl" id="pl">▶ Play</button><p class="sc" id="sc">${paths.length} strokes</p>` + `<div class="steps">${steps}</div>`;

        const strokeEls = [...box.querySelectorAll('.an')];
        const label = $('sc');

        const setProgress = (done) => {
          strokeEls.forEach((p, i) => {
            p.style.transition = 'none';
            p.style.strokeDashoffset = i < done ? 0 : 1;
          });
        };
        const play = () => {
          clearTimers();
          setProgress(0);
          strokeEls.forEach((p, i) => {
            timers.push(
              setTimeout(
                () => {
                  p.getBoundingClientRect(); // paksa reflow agar transisi berjalan
                  p.style.transition = 'stroke-dashoffset .7s linear';
                  p.style.strokeDashoffset = 0;
                  label.textContent = `Strokes ${i + 1} of ${strokeEls.length}`;
                },
                i * 800 + 100,
              ),
            );
          });
        };

        $('pl').onclick = play;
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) setProgress(strokeEls.length);
        else play();

        const count = $('stroke-count');
        if (count && !count.textContent) count.textContent = paths.length + ' goresan';
      }

      /* =====================================================
         8. KOSAKATA (kanjiapi.dev)
         ===================================================== */
      function parseWord(raw, k) {
        const variants = raw.variants || [];
        const v = variants.find((x) => x.written && x.written.includes(k)) || variants[0] || {};
        return {
          written: v.written || v.pronounced || '',
          reading: v.pronounced || '',
          common: variants.some((x) => x.priorities && x.priorities.length > 0),
          meanings: (raw.meanings || []).map((m) => (m.glosses || []).slice(0, 4).join('; ')),
        };
      }

      function wordHtml(w) {
        const text = [...w.written]
          .map((c) => {
            if (c === state.current) return `<span class="cur">${c}</span>`;
            return isKanji(c) ? `<button data-k="${c}">${c}</button>` : `<span>${esc(c)}</span>`;
          })
          .join('');
        const reading = w.reading && w.reading !== w.written ? `<span class="rd">【${esc(w.reading)}】</span>` : '';
        const badge = w.common ? '<span class="tag">umum</span>' : '';
        const meanings = w.meanings
          .slice(0, 3)
          .map((m, i, a) => `<p>${a.length > 1 ? i + 1 + '. ' : ''}${esc(m)}</p>`)
          .join('');
        return `<div class="word"><div><span class="jp">${text}</span>${reading}${badge}</div>${meanings}</div>`;
      }

      function drawWords() {
        const box = $('words');
        if (!box || !state.words) return;
        const all = state.words.list;
        if (!all.length) {
          box.innerHTML = '<p class="empty">No vocabulary found for this kanji.</p>';
          return;
        }

        const common = all.filter((w) => w.common);
        const mode = common.length ? state.wordMode : 'all';
        const shown = mode === 'common' ? common : all;

        let html = '';
        if (common.length && common.length < all.length) {
          html += `<div class="seg"><button class="chip sm${mode === 'common' ? ' on' : ''}" data-wmode="common">Common (${common.length})</button><button class="chip sm${mode === 'all' ? ' on' : ''}" data-wmode="all">All (${all.length})</button></div>`;
        }
        html += shown.slice(0, state.wordLimit).map(wordHtml).join('');
        if (shown.length > state.wordLimit) html += `<button class="more" data-wmore="1">Show more (${shown.length - state.wordLimit})</button>`;
        html += '<p class="note" style="margin-top:12px">Meanings from JMdict (English). Tap the colored kanji to view its details.</p>';
        box.innerHTML = html;
      }

      async function renderWords(k) {
        const box = $('words');
        box.innerHTML = '<p class="sc">Loading vocabulary…</p>';
        try {
          const raw = await fetchJSON(`${KANJIAPI_URL}/words/${encodeURIComponent(k)}`);
          if (state.current !== k) return;
          const list = raw
            .map((w) => parseWord(w, k))
            .filter((w) => w.written)
            .sort((a, b) => b.common - a.common || a.written.length - b.written.length);
          state.words = { kanji: k, list };
          drawWords();

          // Kanji terkait: kanji lain yang paling sering muncul di kosakata umum
          const source = list.filter((w) => w.common).slice(0, 60);
          const counts = {};
          (source.length ? source : list.slice(0, 60)).forEach((w) =>
            [...w.written].forEach((c) => {
              if (c !== k && isKanji(c)) counts[c] = (counts[c] || 0) + 1;
            }),
          );
          const related = Object.keys(counts)
            .sort((a, b) => counts[b] - counts[a])
            .slice(0, RELATED_MAX);
          renderRelated(k, related, 'Kanji terkait');
        } catch {
          if (state.current !== k) return;
          box.innerHTML = '<p class="note">Failed to load vocabulary from kanjiapi.dev. Please check your internet connection.</p>';
        }
      }

      function renderRelated(k, keys, title) {
        const el = $('rel');
        if (!el || state.current !== k || !keys.length) return;
        el.innerHTML = `<h3>${title}</h3><div class="rel">${keys.map(tile).join('')}</div>`;
      }

      /* =====================================================
         9. INTERAKSI & RIWAYAT (tombol Kembali di ponsel)
         ===================================================== */
      searchInput.addEventListener('input', () => {
        state.query = searchInput.value;
        state.limit = LIST_PAGE;
        renderChips();
        showList();
      });

      document.addEventListener('click', (ev) => {
        const btn = ev.target.closest('[data-k],[data-cat],[data-back],[data-nav],[data-more],[data-retry],[data-wmode],[data-wmore]');
        if (!btn) return;
        const ds = btn.dataset;

        if (ds.cat) {
          state.cat = ds.cat;
          state.query = '';
          state.limit = LIST_PAGE;
          searchInput.value = '';
          renderChips();
          if (history.state && history.state.d) history.replaceState(null, '');
          showList();
          window.scrollTo(0, 0);
        } else if (ds.k) {
          history.pushState({ d: ds.k }, '');
          showDetail(ds.k);
        } else if (ds.nav) {
          history.replaceState({ d: ds.nav }, '');
          showDetail(ds.nav);
        } else if (ds.back) {
          if (history.state && history.state.d) history.back();
          else showList();
        } else if (ds.more) {
          state.limit += LIST_PAGE;
          showList();
        } else if (ds.retry) {
          state.jlptStatus = 'idle';
          showList();
          loadJlpt();
        } else if (ds.wmode) {
          state.wordMode = ds.wmode;
          state.wordLimit = WORDS_PAGE;
          drawWords();
        } else if (ds.wmore) {
          state.wordLimit += WORDS_PAGE;
          drawWords();
        }
      });

      window.addEventListener('popstate', (ev) => {
        if (ev.state && ev.state.d) showDetail(ev.state.d);
        else showList();
      });

      /* =====================================================
         10. MULAI
         ===================================================== */
      renderChips();
      showList();
      loadJlpt();
    </script>
  </body>
</html>
