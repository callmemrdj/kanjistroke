<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#c0392b" />
    <title>Aplikasi Kanji MrDJ</title>
    <style>
      :root {
        --bg: #faf8f5;
        --card: #fff;
        --tx: #1f1d1a;
        --mut: #7a746b;
        --bd: #e6e0d6;
        --ac: #c0392b;
        --chip: #f3ece1;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #171614;
          --card: #222120;
          --tx: #f0ece6;
          --mut: #a39c91;
          --bd: #37352f;
          --ac: #ef6c5d;
          --chip: #2e2c28;
          color-scheme: dark;
        }
      }
      :root[data-theme='dark'] {
        --bg: #171614;
        --card: #222120;
        --tx: #f0ece6;
        --mut: #a39c91;
        --bd: #37352f;
        --ac: #ef6c5d;
        --chip: #2e2c28;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html {
        scroll-padding-top: 150px;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          'Noto Sans JP',
          'Noto Sans',
          sans-serif;
        line-height: 1.5;
        touch-action: manipulation;
      }
      button {
        font: inherit;
        color: inherit;
      }
      .hd {
        position: sticky;
        top: 0;
        z-index: 20;
        background: var(--bg);
        border-bottom: 1px solid var(--bd);
        padding: calc(env(safe-area-inset-top, 0px) + 10px) max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px));
      }
      .hd-in {
        max-width: 760px;
        margin: 0 auto;
      }
      .top {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      h1 {
        font-size: 18px;
        margin: 0;
      }
      .cnt {
        color: var(--mut);
        font-size: 12px;
      }
      #q {
        width: 100%;
        height: 44px;
        padding: 0 14px;
        border: 1px solid var(--bd);
        border-radius: 12px;
        background: var(--card);
        color: var(--tx);
        font-size: 16px;
        -webkit-appearance: none;
        appearance: none;
      }
      .chips {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 8px 0 2px;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      .chips::-webkit-scrollbar {
        display: none;
      }
      .chip {
        flex: none;
        min-height: 40px;
        padding: 0 16px;
        border-radius: 99px;
        border: 1px solid var(--bd);
        background: var(--card);
        cursor: pointer;
      }
      .chip.on {
        background: var(--ac);
        border-color: var(--ac);
        color: #fff;
      }
      .wrap {
        max-width: 760px;
        margin: 0 auto;
        padding: 16px max(12px, env(safe-area-inset-right, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
        gap: 8px;
      }
      .tile {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 12px;
        padding: 8px 2px;
        text-align: center;
        cursor: pointer;
        min-height: 76px;
        overflow: hidden;
      }
      .tile:active,
      .tile:hover {
        border-color: var(--ac);
      }
      .tile b {
        display: block;
        font-size: 32px;
        font-weight: 500;
        line-height: 1.2;
      }
      .tile span {
        display: block;
        font-size: 11px;
        color: var(--mut);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        padding: 0 4px;
      }
      .more {
        display: block;
        width: 100%;
        margin-top: 14px;
        min-height: 46px;
        border-radius: 12px;
        border: 1px solid var(--bd);
        background: var(--card);
        cursor: pointer;
      }
      .note,
      .empty {
        color: var(--mut);
        font-size: 14px;
        margin: 0 0 12px;
      }
      .lnk {
        background: none;
        border: 0;
        color: var(--ac);
        text-decoration: underline;
        cursor: pointer;
        padding: 0;
      }
      .back {
        background: none;
        border: 0;
        color: var(--ac);
        cursor: pointer;
        padding: 8px 0;
        min-height: 44px;
      }
      .nav {
        display: flex;
        justify-content: space-between;
        margin-bottom: 6px;
      }
      .nav button {
        background: none;
        border: 0;
        color: var(--ac);
        cursor: pointer;
        padding: 10px 0;
        min-height: 44px;
      }
      .hero {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 16px;
        padding: 18px 16px;
        text-align: center;
      }
      .big {
        font-size: clamp(80px, 30vw, 110px);
        line-height: 1.1;
        margin: 0;
      }
      .strokes {
        color: var(--mut);
        font-size: 13px;
      }
      h2 {
        font-size: 19px;
        margin: 6px 0 12px;
      }
      .row {
        text-align: left;
        margin: 8px 0;
        font-size: 15px;
      }
      .row em {
        font-style: normal;
        color: var(--mut);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-right: 8px;
      }
      .tags {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: center;
        margin-top: 12px;
      }
      .tag {
        background: var(--chip);
        border-radius: 99px;
        padding: 3px 10px;
        font-size: 12px;
      }
      h3 {
        font-size: 16px;
        margin: 22px 0 8px;
      }
      .word {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 12px;
        padding: 10px 14px;
        margin-bottom: 8px;
      }
      .word .jp {
        font-size: 19px;
      }
      .word .jp button {
        font-size: inherit;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
      }
      .word .jp button.k {
        color: var(--ac);
      }
      .word .rd {
        color: var(--mut);
        font-size: 14px;
        margin-left: 6px;
      }
      .word p {
        margin: 2px 0 0;
        font-size: 14px;
        color: var(--mut);
      }
      .rel {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .rel .tile {
        width: 64px;
        min-height: 64px;
      }
      .rel .tile b {
        font-size: 28px;
      }
      .sw {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 16px;
        width: 220px;
        max-width: 100%;
        margin: 0 auto 10px;
      }
      .sw svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .pl {
        display: block;
        margin: 0 auto;
        background: var(--ac);
        color: #fff;
        border: 0;
        border-radius: 99px;
        padding: 0 22px;
        min-height: 44px;
        cursor: pointer;
      }
      .sc {
        text-align: center;
        color: var(--mut);
        font-size: 13px;
        margin: 8px 0 0;
      }
      .ft {
        color: var(--mut);
        font-size: 11px;
        margin-top: 28px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header class="hd" id="hd"></header>
    <main class="wrap" id="main"></main>
    <script src="datakanji/data.js"></script>
    <script>
      var lvl = 'N5';
      X.trim()
        .split('\n')
        .forEach(function (l) {
          l = l.trim();
          if (!l) return;
          if (l.charAt(0) === '#') {
            lvl = l.slice(1).trim();
            return;
          }
          var f = l.split('|');
          D[f[0]] = {
            s: +f[1],
            m: f[2],
            kun: f[3],
            on: f[4],
            lvl: lvl,
            th: f[5],
            kk: '',
            r: f[6],
            w: f[7].split(';').map(function (x) {
              return x.split(',');
            }),
            rel: '',
          };
        });

      var SV = {
        一: ['M12,54 L97,54'],
        二: ['M22,34 L87,34', 'M12,80 L97,80'],
        三: ['M25,24 L84,24', 'M30,54 L80,54', 'M12,86 L97,86'],
        十: ['M14,54 L95,54', 'M54,12 L54,98'],
        人: ['M52,18 C48,50 32,78 12,95', 'M48,48 C60,70 78,88 98,95'],
        大: ['M14,40 L95,40', 'M54,14 C52,50 35,82 12,98', 'M52,48 C62,70 80,88 98,98'],
        小: ['M54,14 L54,92 C54,98 48,98 40,94', 'M34,40 C30,60 22,76 10,90', 'M76,38 C80,58 88,74 100,88'],
        山: ['M54,16 L54,80', 'M20,46 L20,90 L92,90', 'M88,46 L88,90'],
        日: ['M28,16 L28,96', 'M28,16 L82,16 L82,96', 'M28,56 L82,56', 'M28,96 L82,96'],
        月: ['M34,14 C34,60 28,84 14,98', 'M34,14 L84,14 L84,92 C84,98 78,98 70,94', 'M34,40 L84,40', 'M34,66 L84,66'],
        木: ['M12,44 L97,44', 'M54,12 L54,98', 'M52,48 C44,70 28,86 10,96', 'M56,48 C64,70 80,86 98,96'],
        口: ['M26,28 L26,88', 'M26,28 L84,28 L84,88', 'M26,88 L84,88'],
        中: ['M24,34 L24,76', 'M24,34 L84,34 L84,76', 'M24,76 L84,76', 'M54,10 L54,100'],
        上: ['M54,14 L54,84', 'M54,50 L80,50', 'M14,92 L96,92'],
        下: ['M12,22 L96,22', 'M54,22 L54,98', 'M62,52 L84,70'],
        土: ['M26,48 L82,48', 'M54,14 L54,92', 'M14,92 L96,92'],
        川: ['M30,18 C30,56 24,80 12,96', 'M54,14 L54,98', 'M82,14 L82,98'],
        八: ['M40,24 C38,54 26,76 12,90', 'M68,34 C74,60 86,80 98,92'],
        七: ['M14,46 L96,46', 'M46,14 L46,74 C46,92 62,96 94,90'],
      };

      var JSON_URL = 'https://raw.githubusercontent.com/davidluzgouveia/kanji-data/master/kanji.json';
      var VG_URL = 'https://raw.githubusercontent.com/KanjiVG/kanjivg/master/kanji/';
      var CATS = [
        ['hiragana', 'Hiragana'],
        ['katakana', 'Katakana'],
        ['n5', 'N5'],
        ['n4', 'N4'],
        ['n3', 'N3'],
        ['n2', 'N2'],
        ['n1', 'N1'],
      ];
      var cat = 'n5',
        q = '',
        lim = 120,
        cur = null,
        curList = [],
        R = null,
        rs = 'idle',
        tm = [],
        SC = {};
      var HG = 'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん';
      var RO = 'a i u e o ka ki ku ke ko sa shi su se so ta chi tsu te to na ni nu ne no ha hi fu he ho ma mi mu me mo ya yu yo ra ri ru re ro wa wo n'.split(' ');
      var KANA = {};
      function toK(s) {
        return s.replace(/[\u3041-\u3096]/g, function (c) {
          return String.fromCharCode(c.charCodeAt(0) + 96);
        });
      }
      HG.split('').forEach(function (c, i) {
        KANA[c] = RO[i];
        KANA[toK(c)] = RO[i];
      });
      function e(s) {
        return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
        });
      }

      // kanji terkait untuk data lokal: kanji lain yang muncul di kata-katanya
      Object.keys(D).forEach(function (k) {
        var d = D[k];
        if (d.rel) return;
        var s = '';
        d.w.forEach(function (w) {
          w[0].split('').forEach(function (c) {
            if (c !== k && D[c] && s.indexOf(c) < 0) s += c;
          });
        });
        d.rel = s.slice(0, 6);
      });

      function info(k) {
        if (KANA[k]) return { kana: true, m: KANA[k], rom: KANA[k], lv: /[\u3041-\u3096]/.test(k) ? 'Hiragana' : 'Katakana', rel: /[\u3041-\u3096]/.test(k) ? toK(k) : String.fromCharCode(k.charCodeAt(0) - 96) };
        var d = D[k],
          r = R && R[k],
          lv = d && d.lvl ? 'JLPT ' + d.lvl : r && r.jlpt_new ? 'JLPT N' + r.jlpt_new : '';
        if (d) return { s: d.s || (r && r.strokes), m: d.m, kun: d.kun, on: d.on, th: d.th, kk: d.kk, r: d.r, w: d.w, rel: d.rel, lv: lv };
        if (r) return { s: r.strokes, m: (r.meanings || []).slice(0, 4).join(', '), kun: (r.readings_kun || []).join('、') || '—', on: toK((r.readings_on || []).join('、')) || '—', lv: lv, en: true, rel: '' };
        return { m: '', lv: lv, rel: '' };
      }

      /*
      function listFor(c) {
        if (c === 'hiragana') return HG.split('');
        if (c === 'katakana') return HG.split('').map(toK);
        var n = +c.slice(1);
        if (!R) return n === 5 ? Object.keys(D) : [];
        return Object.keys(R)
          .filter(function (k) {
            return R[k].jlpt_new === n;
          })
          .sort(function (a, b) {
            return (R[a].freq || 9999) - (R[b].freq || 9999);
          });
      }
*/
      function listFor(c) {
        if (c === 'hiragana') return HG.split('');
        if (c === 'katakana') return HG.split('').map(toK);
        var L = c.toUpperCase(),
          loc = Object.keys(D).filter(function (k) {
            return D[k].lvl === L;
          });
        if (!R) return loc;
        var n = +c.slice(1);
        var rem = Object.keys(R)
          .filter(function (k) {
            return R[k].jlpt_new === n && !D[k];
          })
          .sort(function (a, b) {
            return (R[a].freq || 9999) - (R[b].freq || 9999);
          });
        return loc.concat(rem);
      }

      function allKeys() {
        var s = {},
          a = [];
        Object.keys(KANA)
          .concat(Object.keys(D), R ? Object.keys(R) : [])
          .forEach(function (k) {
            if (!s[k]) {
              s[k] = 1;
              a.push(k);
            }
          });
        return a;
      }
      function hit(k, t) {
        var i = info(k);
        return (k + ' ' + (i.m || '') + ' ' + (i.kun || '') + ' ' + (i.on || '')).toLowerCase().indexOf(t) > -1;
      }
      function tile(k) {
        return '<button class="tile" data-k="' + k + '"><b>' + k + '</b><span>' + e((info(k).m || '').split(',')[0]) + '</span></button>';
      }

      // ---- header ----
      var hd = document.getElementById('hd'),
        main = document.getElementById('main');
      hd.innerHTML =
        '<div class="hd-in"><div class="top"><h1>漢字 Kanji</h1><span class="cnt" id="cnt"></span></div><input id="q" type="search" placeholder="Cari kanji, arti, atau bacaan…" autocomplete="off" autocapitalize="off"><div class="chips" id="chips"></div></div>';
      var qi = document.getElementById('q'),
        cnt = document.getElementById('cnt');
      function chips() {
        document.getElementById('chips').innerHTML = CATS.map(function (c) {
          return '<button class="chip' + (c[0] === cat && !q.trim() ? ' on' : '') + '" data-cat="' + c[0] + '">' + c[1] + '</button>';
        }).join('');
      }
      qi.addEventListener('input', function () {
        q = qi.value;
        lim = 120;
        chips();
        showList();
      });

      // ---- daftar ----
      function showList() {
        cur = null;
        tm.forEach(clearTimeout);
        var t = q.trim().toLowerCase(),
          list = t
            ? allKeys().filter(function (k) {
                return hit(k, t);
              })
            : listFor(cat),
          st = '';
        curList = list;
        if (!t && cat.charAt(0) === 'n') {
          if (rs === 'loading' || rs === 'idle') st = '<p class="note">Memuat data kanji dari GitHub…</p>';
          if (rs === 'err') st = '<p class="note">Gagal memuat data dari GitHub. Periksa koneksi internet. <button class="lnk" data-retry="1">Coba lagi</button></p>';
        }
        main.innerHTML =
          st +
          (list.length
            ? '<div class="grid">' + list.slice(0, lim).map(tile).join('') + '</div>' + (list.length > lim ? '<button class="more" data-more="1">Tampilkan lebih banyak (' + (list.length - lim) + ')</button>' : '')
            : st
              ? ''
              : '<p class="empty">Tidak ada hasil.</p>') +
          '<p class="ft">Data: KanjiVG (CC BY-SA 3.0) dan kanji-data (KANJIDIC)</p>';
        cnt.textContent = list.length + ' karakter';
      }

      // ---- detail ----
      function wordHtml(w) {
        var t = w[0]
          .split('')
          .map(function (c) {
            return D[c] || KANA[c] ? '<button class="k" data-k="' + c + '">' + c + '</button>' : '<span>' + c + '</span>';
          })
          .join('');
        return '<div class="word"><div><span class="jp">' + t + '</span><span class="rd">【' + e(w[1]) + '】</span></div><p>' + e(w[2]) + '</p></div>';
      }
      function showDetail(k) {
        var d = info(k),
          i = curList.indexOf(k);
        cur = k;
        var h = '<button class="back" data-back="1">← Kembali</button>';
        if (i > -1 && curList.length > 1)
          h += '<div class="nav"><button data-nav="' + curList[(i - 1 + curList.length) % curList.length] + '">« Sebelumnya</button><button data-nav="' + curList[(i + 1) % curList.length] + '">Selanjutnya »</button></div>';
        h += '<div class="hero"><p class="big">' + k + '</p><div class="strokes">' + (d.s ? d.s + ' goresan' : '') + '</div><h2>' + e(d.m || '—') + '</h2>';
        if (!d.kana) h += '<div class="row"><em>Kun</em>' + e(d.kun || '—') + '</div><div class="row"><em>On</em>' + e(d.on || '—') + '</div>';
        h +=
          '<div class="tags"><span class="tag">' +
          e(d.lv) +
          '</span>' +
          (d.th ? '<span class="tag">' + e(d.th) + '</span>' : '') +
          (d.kk ? '<span class="tag">' + e(d.kk) + '</span>' : '') +
          '</div>' +
          (d.en ? '<p class="note" style="margin:12px 0 0">Arti dari dataset berbahasa Inggris.</p>' : '') +
          '</div>';
        h += '<h3>Urutan goresan</h3><div id="sv"></div>';
        if (d.r) h += '<h3>Radikal</h3><div class="rel"><div class="tile" style="cursor:default"><b>' + d.r + '</b></div></div>';
        if (d.w) h += '<h3>Kata umum</h3>' + d.w.map(wordHtml).join('');
        var rl = (d.rel || '').split('').filter(function (c) {
          return D[c] || KANA[c] || (R && R[c]);
        });
        if (rl.length) h += '<h3>' + (d.kana ? 'Padanan' : 'Kanji terkait') + '</h3><div class="rel">' + rl.map(tile).join('') + '</div>';
        main.innerHTML = h;
        window.scrollTo(0, 0);
        initStroke(k);
      }

      // ---- animasi goresan (KanjiVG) ----
      function getStrokes(k) {
        if (SC[k]) return Promise.resolve(SC[k]);
        var u = VG_URL + k.codePointAt(0).toString(16).padStart(5, '0') + '.svg';
        return fetch(u)
          .then(function (r) {
            if (!r.ok) throw 0;
            return r.text();
          })
          .then(function (t) {
            var x = new DOMParser().parseFromString(t, 'image/svg+xml');
            var p = [].map.call(x.querySelectorAll('path'), function (n) {
              return n.getAttribute('d');
            });
            if (!p.length) throw 0;
            return (SC[k] = p);
          })
          .catch(function () {
            return SV[k] || null;
          });
      }
      function initStroke(k) {
        var box = document.getElementById('sv');
        box.innerHTML = '<p class="sc">Memuat animasi…</p>';
        getStrokes(k).then(function (P) {
          if (cur !== k) return;
          if (!P) {
            box.innerHTML = '<p class="sc">Tidak dapat memuat urutan goresan dari KanjiVG. Periksa koneksi internet.</p>';
            return;
          }
          var g = '<path d="M54.5,4 V105 M4,54.5 H105" stroke="var(--bd)" stroke-width="0.5" stroke-dasharray="3 4"/>';
          var gh = P.map(function (d) {
            return '<path d="' + d + '" stroke="var(--bd)"/>';
          }).join('');
          var an = P.map(function (d) {
            return '<path class="an" d="' + d + '" stroke="var(--tx)"/>';
          }).join('');
          box.innerHTML =
            '<div class="sw"><svg viewBox="0 0 109 109" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">' +
            g +
            gh +
            an +
            '</svg></div><button class="pl" id="pl">▶ Putar animasi</button><p class="sc" id="sc">' +
            P.length +
            ' goresan</p>';
          var ps = [].slice.call(box.querySelectorAll('.an'));
          function play() {
            tm.forEach(clearTimeout);
            tm = [];
            ps.forEach(function (p) {
              var L = p.getTotalLength();
              p.style.transition = 'none';
              p.style.strokeDasharray = L;
              p.style.strokeDashoffset = L;
            });
            ps.forEach(function (p, i) {
              tm.push(
                setTimeout(
                  function () {
                    p.getBoundingClientRect();
                    p.style.transition = 'stroke-dashoffset .7s linear';
                    p.style.strokeDashoffset = 0;
                    var s = document.getElementById('sc');
                    if (s) s.textContent = 'Goresan ' + (i + 1) + ' dari ' + ps.length;
                  },
                  i * 800 + 100,
                ),
              );
            });
          }
          document.getElementById('pl').onclick = play;
          play();
          if (!/goresan$/.test(document.querySelector('.strokes').textContent)) document.querySelector('.strokes').textContent = P.length + ' goresan';
        });
      }

      // ---- data jlpt dari GitHub ----
      function loadR() {
        if (rs === 'loading') return;
        rs = 'loading';
        fetch(JSON_URL)
          .then(function (r) {
            if (!r.ok) throw 0;
            return r.json();
          })
          .then(function (j) {
            R = j;
            rs = 'ok';
            if (cur === null) showList();
          })
          .catch(function () {
            rs = 'err';
            if (cur === null) showList();
          });
      }

      // ---- interaksi & riwayat (tombol Kembali di ponsel) ----
      document.addEventListener('click', function (ev) {
        var b = ev.target.closest('[data-k],[data-cat],[data-back],[data-nav],[data-more],[data-retry]');
        if (!b) return;
        var ds = b.dataset;
        if (ds.cat) {
          cat = ds.cat;
          q = '';
          qi.value = '';
          lim = 120;
          chips();
          if (history.state && history.state.d) history.replaceState(null, '');
          showList();
          window.scrollTo(0, 0);
        } else if (ds.k) {
          history.pushState({ d: ds.k }, '');
          showDetail(ds.k);
        } else if (ds.nav) {
          history.replaceState({ d: ds.nav }, '');
          showDetail(ds.nav);
        } else if (ds.back) {
          if (history.state && history.state.d) history.back();
          else showList();
        } else if (ds.more) {
          lim += 120;
          showList();
        } else if (ds.retry) {
          rs = 'idle';
          showList();
          loadR();
        }
      });
      window.addEventListener('popstate', function (ev) {
        if (ev.state && ev.state.d) showDetail(ev.state.d);
        else showList();
      });
      chips();
      showList();
      loadR();
    </script>
  </body>
</html>
